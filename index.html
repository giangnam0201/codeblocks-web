<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code::Blocks Web IDE — Free Online C++ Compiler</title>
<meta name="description" content="Code::Blocks Web is a free, private online C and C++ IDE. Write, compile, run, and debug programs directly in your browser with WebAssembly.">
<meta name="keywords" content="online C++ compiler, online C compiler, Code::Blocks, C++ IDE, WebAssembly compiler, learn C++">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://codeblocks.bond/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Code::Blocks Web">
<meta property="og:title" content="Code::Blocks Web IDE — Free Online C++ Compiler">
<meta property="og:description" content="Write, compile, run, and debug C and C++ programs privately in your browser.">
<meta property="og:url" content="https://codeblocks.bond/">
<meta property="og:image" content="https://codeblocks.bond/assets/codeblocks.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Code::Blocks Web IDE — Free Online C++ Compiler">
<meta name="twitter:description" content="A private, browser-based C and C++ development environment powered by WebAssembly.">
<link rel="icon" href="assets/codeblocks.png">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Code::Blocks Web","url":"https://codeblocks.bond/","description":"A free browser-based C and C++ IDE and compiler powered by WebAssembly.","applicationCategory":"DeveloperApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
</script>
<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="css/cb.css">
</head>
<body>

<div id="frame">

  <div id="menubar"></div>

  <div id="toolbar-dock">
    <div class="tb-row">
      <div class="cb-toolbar" id="tb-main"></div>
      <div class="cb-toolbar" id="tb-compiler"></div>
      <div class="cb-toolbar" id="tb-debugger"></div>
      <div class="cb-toolbar" id="tb-codecompletion"></div>
    </div>
    <div class="tb-row">
      <div class="cb-toolbar" id="tb-browsetracker"></div>
      <div class="cb-toolbar" id="tb-doxyblocks"></div>
      <div class="cb-toolbar" id="tb-incsearch"></div>
      <div class="cb-toolbar" id="tb-wxsmith"></div>
      <div class="cb-toolbar" id="tb-symbols"></div>
    </div>
  </div>

  <div id="main-area">

    <!-- Management ------------------------------------------------------- -->
    <div class="cb-pane" id="pane-management" style="width:200px">
      <div class="pane-caption">
        <span class="title">Management</span>
        <span class="pane-btn" data-act="close" title="Close"></span>
      </div>
      <div class="pane-body">
        <div class="cb-notebook" id="nb-management">
          <div class="nb-tabs"></div>
          <div class="nb-pages"></div>
        </div>
      </div>
    </div>

    <div class="sash-v" id="sash-left"></div>

    <div id="center-col">
      <!-- Editors ------------------------------------------------------- -->
      <div class="cb-notebook" id="nb-editors" style="flex:1;min-height:0">
        <div class="nb-tabs"></div>
        <div class="nb-pages"></div>
      </div>

      <div class="sash-h" id="sash-bottom"></div>

      <!-- Logs & others ------------------------------------------------- -->
      <div class="cb-pane inactive" id="pane-logs" style="height:150px;flex:none">
        <div class="pane-caption">
          <span class="title">Logs &amp; others</span>
          <span class="pane-btn" data-act="close" title="Close"></span>
        </div>
        <div class="pane-body">
          <div class="cb-notebook" id="nb-logs">
            <div class="nb-tabs"></div>
            <div class="nb-pages"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Nine fields, exactly as MainStatusBar::CreateAndFill lays them out -->
  <div id="statusbar">
    <div class="field grow" id="sb-0">Welcome to Code::Blocks!</div>
    <div class="field button" id="sb-1" style="width:104px"></div>
    <div class="field" id="sb-2" style="width:116px"></div>
    <div class="field" id="sb-3" style="width:106px"></div>
    <div class="field" id="sb-4" style="width:180px"></div>
    <div class="field" id="sb-5" style="width:66px"></div>
    <div class="field" id="sb-6" style="width:64px"></div>
    <div class="field" id="sb-7" style="width:84px"></div>
    <div class="field" id="sb-8" style="width:96px"></div>
    <div class="flag" title="Interface language">
      <svg width="20" height="13" viewBox="0 0 20 13">
        <rect width="20" height="13" fill="#fff"/>
        <g fill="#b22234">
          <rect width="20" height="1" y="0"/><rect width="20" height="1" y="2"/>
          <rect width="20" height="1" y="4"/><rect width="20" height="1" y="6"/>
          <rect width="20" height="1" y="8"/><rect width="20" height="1" y="10"/>
          <rect width="20" height="1" y="12"/>
        </g>
        <rect width="9" height="7" fill="#3c3b6e"/>
      </svg>
    </div>
  </div>
</div>

<script src="vendor/codemirror/codemirror.js"></script>
<script src="vendor/codemirror/mode/clike/clike.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.js"></script>
<script src="vendor/codemirror/addon/comment/comment.js"></script>
<script src="vendor/codemirror/addon/fold/foldcode.js"></script>
<script src="vendor/codemirror/addon/fold/foldgutter.js"></script>
<script src="vendor/codemirror/addon/fold/brace-fold.js"></script>
<script src="vendor/codemirror/addon/fold/comment-fold.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="vendor/codemirror/addon/search/search.js"></script>
<script src="vendor/codemirror/addon/display/rulers.js"></script>

<!-- The compiler itself is loaded by js/toolchain-worker.js, on its own
     thread, so that building never blocks the interface. -->
<script src="js/menudata.js"></script>
<script src="js/ui.js"></script>
<script src="js/files.js"></script>
<script src="js/toolchain.js"></script>
<script src="js/cpp.js"></script>
<script src="js/console.js"></script>
<script src="js/build.js"></script>
<script src="js/features.js"></script>
<script src="js/app.js"></script>
</body>
</html>
